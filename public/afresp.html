.plus{font-family:"Newsreader",Georgia,serif; font-size:26px; color:var(--olive-soft); line-height:1}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 32px 28px}
.lockup{justify-content:center;margin-bottom:28px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:26px;line-height:1.2;margin:0 0 8px;text-align:center}
p.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px;text-align:center}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;outline:none}
input:focus{border-color:var(--olive)}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;font-size:15px;color:var(--bg);background:var(--olive);border:0;border-radius:8px;padding:12px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:var(--err)}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <div class="lockup">
    <span class="logo logo-telos" role="img" aria-label="Telos Wealth"></span>
    <span class="plus" aria-hidden="true">+</span>
    <span class="logo logo-afresp" role="img" aria-label="Afresp"></span>
  </div>
  <h1>Parceria Telos + Afresp</h1>
  <p class="sub">Acompanhamento semanal. Acesso restrito à diretoria da Afresp.</p>
  <label for="pw">Senha de acesso</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Entrar</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="foot">Telos Wealth</div>
</form>
